<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Criar conta</title>
</head>

<body>

    <h1>Criar conta</h1>

    <form method="POST" action="http://127.0.0.1:5000/register">

        <div>
            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >
        </div>

        <br>

        <div>
            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >
        </div>

        <br>

        <div>
            <label>Senha</label>

            <input
                type="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Criar conta
        </button>

    </form>

</body>

</html>
